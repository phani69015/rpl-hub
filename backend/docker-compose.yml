services:
  # Host ports 7234/8234 avoid clashing with another Temporal dev server on 7233/8233.
  # Not used by the app until the workflow phase.
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports: ["7234:7233", "8234:8233"]
    volumes: [temporaldata:/data]

volumes:
  temporaldata:
