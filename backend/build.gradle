plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.rplhub'
repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.release = 21 }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'io.temporal:temporal-sdk:1.40.0'
    implementation 'com.github.jknack:handlebars:4.5.5'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.97'
    testImplementation 'io.temporal:temporal-testing:1.40.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
