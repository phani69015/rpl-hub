spring:
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  threads:
    virtual:
      enabled: true

server:
  error:
    include-message: always

app:
  seed:
    enabled: ${SEED_DEFAULT_TRADES:true}   # import + publish the bundled default trades when no qualifications exist
  db:
    path: ${DB_PATH:./data/rplhub.db}   # SQLite file; created on first start
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7234}
    namespace: ${TEMPORAL_NAMESPACE:default}
    api-key: ${TEMPORAL_API_KEY:}   # set for Temporal Cloud; enables TLS
    worker-enabled: true
  evidence:
    dir: ${EVIDENCE_DIR:./data/evidence}
  report:
    gap-threshold-percent: 60   # a competency scoring below this % of max is listed as a skill gap
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
    ttl-hours: 8
  otp:
    mock-code: "123456"   # OTP is mocked until an SMS provider is chosen
  bootstrap-admin-phone: ${BOOTSTRAP_ADMIN_PHONE:+919999999999}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # comma-separated frontend origins
  ai:
    enabled: ${AI_ENABLED:true}   # false: no Groq calls, no AI summary; matching falls back to keywords
  groq:
    api-key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    base-url: https://api.groq.com/openai/v1
